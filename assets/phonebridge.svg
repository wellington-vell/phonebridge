<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Phonebridge: a phone (camera lens + microphone) streaming to the PC. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <g transform="translate(-38 0)">
    <!-- phone -->
    <rect x="250" y="172" width="330" height="680" rx="72" fill="#ffffff"/>
    <rect x="280" y="232" width="270" height="560" rx="40" fill="url(#screen)"/>
    <!-- camera lens -->
    <circle cx="415" cy="430" r="98" fill="#dbeafe"/>
    <circle cx="415" cy="430" r="66" fill="#2563eb"/>
    <circle cx="415" cy="430" r="30" fill="#0f172a"/>
    <circle cx="392" cy="406" r="13" fill="#ffffff" opacity="0.9"/>
    <!-- microphone -->
    <rect x="393" y="590" width="44" height="86" rx="22" fill="#ffffff"/>
    <path d="M369 640a46 46 0 0 0 92 0M415 686v32M389 718h52" fill="none"
          stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <!-- signal to the PC -->
    <g fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round">
      <path d="M691.9 434.8A120 120 0 0 1 691.9 589.2"/>
      <path d="M753.2 383.4A200 200 0 0 1 753.2 640.6" opacity="0.8"/>
      <path d="M814.5 332A280 280 0 0 1 814.5 692" opacity="0.6"/>
    </g>
  </g>
</svg>
