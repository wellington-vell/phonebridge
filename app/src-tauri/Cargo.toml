[package]
name = "wemic-app"
version = "0.1.0"
description = "Use your Android phone as a microphone for the wemic Linux client"
edition = "2024"

[lib]
name = "wemic_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
opus-head-sys = { version = "0.3", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = { version = "0.6", features = ["audio"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
