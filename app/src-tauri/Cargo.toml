[package]
name = "phonebridge-app"
version = "0.1.0"
description = "Use your Android phone as a microphone and webcam for the phonebridge Linux client"
edition = "2024"

[lib]
name = "phonebridge_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
opus-head-sys = { version = "0.3", default-features = false }
# PBA1 secure channel (docs/secure-channel.md)
aes-gcm = "0.10"
getrandom = "0.3"
hkdf = "0.12"
sha2 = "0.11"
subtle = "2"

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = { version = "0.6", features = ["audio"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
